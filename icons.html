<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="description" content="The SLO Education icon set: line icons for SLIs, SLOs, error budgets and incident response, with live customisation.">
    <title>Icon Set - SLO Education Hub</title>
    <link rel="stylesheet" href="style/inter.css">
    <link rel="stylesheet" href="style/styles.css">
    <link rel="stylesheet" href="style/icons.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <h1 class="logo"><a href="/" style="color: white; text-decoration: none;">SLO Education</a></h1>
                <ul class="nav-links"></ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h2>Icon Set</h2>
                <p class="hero-subtitle"><span id="icon-count">50</span> line icons for reliability work. Resize, restyle and recolour them below, then copy the markup.</p>
            </div>
        </section>

        <section class="section">
            <div class="container" id="icon-lab-root">
                <div class="icon-lab">
                    <label>Size <input type="range" id="lab-size" min="16" max="64" step="2" value="32"></label>
                    <label>Stroke <input type="range" id="lab-stroke" min="1" max="2.5" step="0.1" value="1.6"></label>
                    <label>Colour <input type="color" id="lab-color" value="#2D6A4F"></label>
                    <label>Tile
                        <select id="lab-tile">
                            <option value="pebble">Pebble</option>
                            <option value="solid">Solid</option>
                            <option value="none">None</option>
                        </select>
                    </label>
                    <label>Tone
                        <select id="lab-tone">
                            <option value="default">Brand green</option>
                            <option value="success">Success</option>
                            <option value="info">Info</option>
                            <option value="caution">Caution</option>
                            <option value="risk">Risk</option>
                        </select>
                    </label>
                    <pre class="icon-lab-output" id="icon-lab-output"></pre>
                </div>

                <ul class="icon-grid" id="icon-grid"></ul>
            </div>
        </section>
    </main>

    <footer></footer>

    <script src="scripts/menu.js"></script>
    <script src="scripts/icons.js" defer></script>
    <script src="scripts/footer.js" defer></script>
</body>
</html>
